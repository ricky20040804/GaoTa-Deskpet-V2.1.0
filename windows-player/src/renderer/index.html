<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; media-src 'self' file:; img-src 'self' data:; style-src 'self'; script-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GaoTa Deskpet</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <video id="petVideo" muted playsinline preload="auto"></video>
      <canvas id="petCanvas" width="420" height="420"></canvas>

      <section id="emptyState" class="empty-state" hidden>
        <strong>没有找到宠物资源</strong>
        <span>请把 custompet 解压到“下载”文件夹后，右键选择重新读取。</span>
      </section>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>

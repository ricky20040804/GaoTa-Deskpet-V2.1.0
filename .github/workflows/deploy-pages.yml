name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  windows-runner:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Tauri Windows player
        id: build_windows
        shell: pwsh
        run: |
          $logPath = Join-Path $PWD "..\windows-build.log"
          npm install @tauri-apps/cli@^2 --no-save
          npx tauri build *>&1 | Tee-Object $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $tail = ""
            if (Test-Path $logPath) {
              $tail = (Get-Content $logPath -Tail 80) -join "`n"
            }
            $escaped = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=Windows Tauri build failed::$escaped"
            exit $exitCode
          }
        working-directory: windows-tauri-player

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: windows-build.log

      - name: Zip Windows player
        shell: pwsh
        run: |
          $installer = Get-ChildItem $PWD -Filter "*.exe" -Recurse |
            Where-Object {
              $_.FullName -match "\\bundle\\nsis\\" -and
              $_.FullName -notmatch "\\deps\\" -and
              $_.FullName -notmatch "\\build\\"
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            Write-Host "Tauri build did not produce an NSIS installer. Target contents:"
            Get-ChildItem windows-tauri-player/src-tauri/target -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 300 |
              ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Packaging installer: $($installer.FullName)"
          New-Item -ItemType Directory -Path windows-runner-package -Force | Out-Null
          Copy-Item $installer.FullName windows-runner-package/GaoTa-Deskpet-Windows-Setup.exe
          @(
            "GaoTa Deskpet Windows 运行器",
            "",
            "1. 双击 GaoTa-Deskpet-Windows-Setup.exe 安装。",
            "2. 安装完成后打开 GaoTa Deskpet。",
            "3. 把官网生成的 custompet.zip 解压到“下载”文件夹，运行器会自动读取。"
          ) | Set-Content -Path windows-runner-package/README-Windows.txt -Encoding UTF8
          Compress-Archive -Path windows-runner-package/* -DestinationPath gaotadeskpet-windows.zip -Force

      - name: Upload Windows runner
        uses: actions/upload-artifact@v4
        with:
          name: windows-runner
          path: gaotadeskpet-windows.zip
          if-no-files-found: error

  build:
    needs: windows-runner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Download Windows runner
        uses: actions/download-artifact@v4
        with:
          name: windows-runner
          path: website/public/downloads

      - name: Build website
        run: npm run build
        env:
          REACT_APP_GENERATE_API_URL: https://api.gaotadeskpet.cn/api/generate-pet-package

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

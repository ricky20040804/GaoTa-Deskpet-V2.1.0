name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  windows-runner:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri Windows player
        id: build_windows
        shell: pwsh
        run: |
          cargo tauri build --no-bundle *>&1 | Tee-Object ../windows-build.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        working-directory: windows-tauri-player

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: windows-build.log

      - name: Zip Windows player
        shell: pwsh
        run: |
          $searchRoots = @("windows-tauri-player/src-tauri/target/release", "target/release")
          $exe = $null
          foreach ($root in $searchRoots) {
            if (Test-Path $root) {
              $exe = Get-ChildItem $root -Filter *.exe -Recurse |
                Where-Object { $_.FullName -notmatch "\\deps\\" -and $_.FullName -notmatch "\\build\\" } |
                Select-Object -First 1
              if ($exe) {
                break
              }
            }
          }
          if (-not $exe) {
            Write-Host "Tauri build did not produce a Windows exe. Target contents:"
            Get-ChildItem windows-tauri-player/src-tauri/target -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 200 |
              ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Copy-Item $exe.FullName GaoTa-Deskpet-Windows.exe
          Compress-Archive -Path GaoTa-Deskpet-Windows.exe -DestinationPath gaotadeskpet-windows.zip -Force

      - name: Upload Windows runner
        uses: actions/upload-artifact@v4
        with:
          name: windows-runner
          path: gaotadeskpet-windows.zip
          if-no-files-found: error

  build:
    needs: windows-runner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Download Windows runner
        uses: actions/download-artifact@v4
        with:
          name: windows-runner
          path: website/public/downloads

      - name: Build website
        run: npm run build
        env:
          REACT_APP_GENERATE_API_URL: https://api.gaotadeskpet.cn/api/generate-pet-package

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

[package]
name = "gaota-deskpet-windows"
version = "2.1.0"
description = "GaoTa Deskpet lightweight Windows runner"
authors = ["GaoTa Deskpet"]
edition = "2021"

[lib]
name = "gaota_deskpet_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
